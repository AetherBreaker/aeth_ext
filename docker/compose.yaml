services:

  central-log-server:
    container_name: central-log-server
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_TAG: v10.1.0
        GIT_REPO: https://github.com/AetherBreaker/aeth_ext.git
    restart: on-failure:3
    expose:
      - 8080
    volumes:
      - type: bind
        source: /data/central_log_server_files
        target: /app/persisted_data
    environment:
      - ALERTS_EMAIL=info@sweetfiretobacco.com
      - ALERTS_EMAIL_PWD=${ALERTS_EMAIL_PWD:?}
      - ALERTS_RECIPIENTS=["jacob.ogden@sweetfiretobacco.com"]
      - HEARTBEAT_SLUG=central-log-server
      - WG_PRIVATE_KEY=${WG_PRIVATE_KEY:?}
      - WG_HUB_URL=${WG_HUB_URL:?}
      - WG_HUB_REPO=${WG_HUB_REPO:?}
      - WG_HUB_TOKEN=${WG_HUB_TOKEN:-}
      # The log server keeps serving the VPS over the coolify network while the hub is unreachable (timeclock design §10.7, R22).
      - WG_TOLERATE_DISCONNECTED=1
    networks:
      coolify:
        aliases:
          - central-log-server
    labels:
      - "traefik.http.middlewares.logauth.basicauth.users=admin:$2a$05$9CWerMKGo26UptRyu.CMxOajlnkDwUrRe9frfdQhCYgh0Iy17/n6W"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/devkit-container
        - healthcheck
        - --file
        - /app/persisted_data/logs/heartbeat.txt
        - --file
        - /app/persisted_data/logs/wireguard-heartbeat.txt
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    cap_add:
      - NET_ADMIN

networks:
  coolify:
    external: true
